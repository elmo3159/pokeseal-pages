<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>推しコール 管理コンソール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0912; --bg2:#12101f; --surface:rgba(255,255,255,.045); --surface2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.10); --border2:rgba(255,255,255,.18);
  --text:#F3F0FA; --muted:#A79FC0; --dim:#6F6889;
  --pink:#FF5C8A; --purple:#7C4DFF; --teal:#00E5C0; --gold:#FFC24B; --red:#FF5468; --blue:#4DA3FF;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"M PLUS Rounded 1c",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(900px 700px at 12% -10%, rgba(124,77,255,.28), transparent 60%),
    radial-gradient(800px 600px at 88% 8%, rgba(255,92,138,.22), transparent 62%),
    radial-gradient(700px 700px at 50% 110%, rgba(0,229,192,.14), transparent 60%),
    linear-gradient(180deg,#0a0912,#0f0d1c 60%,#0a0912);
}
body::after{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
a{color:var(--pink);text-decoration:none}
button{font-family:inherit}

/* ---------- ログイン ---------- */
#gate{position:fixed;inset:0;display:grid;place-items:center;z-index:200;padding:24px}
.gate-card{
  width:min(420px,100%); background:rgba(20,17,34,.86); backdrop-filter:blur(24px);
  border:1px solid var(--border2); border-radius:26px; padding:34px 30px; box-shadow:var(--shadow);
  animation:pop .5s cubic-bezier(.2,1.2,.3,1) both;
}
.gate-logo{font-size:34px;font-weight:800;letter-spacing:.02em;background:linear-gradient(100deg,var(--pink),var(--purple) 55%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 4px}
.gate-sub{color:var(--muted);font-size:12.5px;margin:0 0 22px}
input,select,textarea{
  width:100%;background:rgba(0,0,0,.32);border:1px solid var(--border2);color:var(--text);
  border-radius:12px;padding:11px 13px;font-size:14px;font-family:inherit;outline:none;transition:.18s;
}
input:focus,select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,92,138,.16)}
select option{background:#171429}
.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  background:linear-gradient(100deg,var(--pink),var(--purple));border:none;color:#fff;font-weight:700;
  padding:11px 18px;border-radius:12px;cursor:pointer;font-size:14px;transition:transform .14s,filter .18s,box-shadow .18s;
  box-shadow:0 8px 22px rgba(124,77,255,.30);
}
.btn:hover{filter:brightness(1.08);box-shadow:0 12px 28px rgba(124,77,255,.42)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--surface2);box-shadow:none;border:1px solid var(--border2);color:var(--text);font-weight:500}
.btn.ghost:hover{background:rgba(255,255,255,.13)}
.btn.danger{background:linear-gradient(100deg,#FF4D6D,#C81E43);box-shadow:0 8px 22px rgba(255,77,109,.3)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.xs{padding:4px 9px;font-size:11.5px;border-radius:8px}

/* ---------- レイアウト ---------- */
#app{display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:236px 1fr}
aside{
  position:sticky;top:0;height:100vh;padding:22px 14px;overflow-y:auto;
  background:rgba(15,12,28,.62);backdrop-filter:blur(22px);border-right:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px 18px;font-weight:800;font-size:17px}
.brand .dot{width:11px;height:11px;border-radius:99px;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 0 14px var(--pink);animation:pulse 2.4s ease-in-out infinite}
.nav-group{margin:14px 0 6px;padding:0 10px;font-size:10.5px;letter-spacing:.12em;color:var(--dim);font-weight:700}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;color:var(--muted);
  cursor:pointer;font-size:13.5px;font-weight:500;transition:.16s;position:relative;
}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.on{background:linear-gradient(100deg,rgba(255,92,138,.20),rgba(124,77,255,.16));color:#fff;font-weight:700}
.nav-item.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:9px;background:linear-gradient(var(--pink),var(--purple))}
.nav-item .ic{width:18px;text-align:center;font-size:15px}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:99px}
main{padding:24px 28px 70px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:23px;margin:0;font-weight:800;letter-spacing:.01em}
.crumb{color:var(--dim);font-size:12px;margin-top:2px}
.spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);
  padding:5px 11px;border-radius:99px;font-size:12px;color:var(--muted);
}
.chip.on{background:linear-gradient(100deg,rgba(255,92,138,.24),rgba(124,77,255,.2));color:#fff;border-color:transparent;font-weight:700}
.chip.click{cursor:pointer;transition:.15s}
.chip.click:hover{background:var(--surface2);color:var(--text)}
.live-dot{width:7px;height:7px;border-radius:99px;background:var(--teal);box-shadow:0 0 9px var(--teal);animation:pulse 1.6s infinite}

/* ---------- カード ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;
  backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.22);
}
.card h2{font-size:14.5px;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .cnt{color:var(--dim);font-weight:500;font-size:12px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:14px 15px;position:relative;overflow:hidden;
  transition:transform .2s,border-color .2s;
}
.kpi:hover{transform:translateY(-3px);border-color:var(--border2)}
.kpi::after{content:"";position:absolute;right:-24px;top:-24px;width:76px;height:76px;border-radius:99px;background:var(--accent,var(--purple));opacity:.14;filter:blur(14px)}
.kpi .lbl{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.01em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11px;color:var(--dim);margin-top:1px}

/* ---------- テーブル ---------- */
.tw{overflow-x:auto;margin:0 -18px -18px;padding:0 18px 18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;color:var(--dim);font-weight:700;font-size:11px;letter-spacing:.06em;
  padding:0 10px 9px;border-bottom:1px solid var(--border);white-space:nowrap;
}
th.s{cursor:pointer;user-select:none} th.s:hover{color:var(--text)}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tbody tr{transition:background .14s}
tbody tr:hover{background:rgba(255,255,255,.045)}
tbody tr.click{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted)}
.trunc{max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--dim);padding:34px 0;font-size:13px}

/* ---------- 部品 ---------- */
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.g{background:rgba(0,229,192,.16);color:var(--teal)}
.tag.r{background:rgba(255,84,104,.18);color:#FF8494}
.tag.y{background:rgba(255,194,75,.16);color:var(--gold)}
.tag.p{background:rgba(124,77,255,.2);color:#B79BFF}
.tag.n{background:rgba(255,255,255,.08);color:var(--muted)}
.avatar{width:26px;height:26px;border-radius:99px;object-fit:cover;background:var(--surface2);display:inline-grid;place-items:center;font-size:14px;vertical-align:middle;flex:none}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:6px;flex:none}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;min-width:56px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--purple));animation:grow .8s cubic-bezier(.2,1,.3,1) both}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.11),rgba(255,255,255,.05));background-size:220% 100%;animation:sh 1.3s infinite;border-radius:10px;height:14px}

/* ---------- モーダル・トースト ---------- */
#modal{position:fixed;inset:0;background:rgba(5,4,12,.72);backdrop-filter:blur(7px);z-index:150;display:none;place-items:center;padding:22px}
#modal.on{display:grid}
.modal-card{
  width:min(720px,100%);max-height:86vh;overflow:auto;background:#16132a;border:1px solid var(--border2);
  border-radius:22px;padding:24px;box-shadow:var(--shadow);animation:pop .34s cubic-bezier(.2,1.2,.3,1) both;
}
.modal-card h3{margin:0 0 16px;font-size:17px;font-weight:800}
#toast{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{
  background:rgba(24,20,44,.95);border:1px solid var(--border2);border-left:3px solid var(--teal);
  padding:11px 16px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);animation:slideIn .32s cubic-bezier(.2,1.2,.3,1) both;max-width:380px;
}
.toast.err{border-left-color:var(--red)}

/* ---------- アニメーション ---------- */
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.85)}}
@keyframes sh{0%{background-position:220% 0}100%{background-position:-20% 0}}
@keyframes grow{from{width:0 !important}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.anim{animation:fadeUp .45s cubic-bezier(.2,1,.3,1) both}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
@media (max-width:900px){
  #app.on{grid-template-columns:1fr}
  aside{position:static;height:auto;display:flex;gap:6px;overflow-x:auto;padding:12px;border-right:none;border-bottom:1px solid var(--border)}
  .brand{display:none}.nav-group{display:none}
  .nav-item{white-space:nowrap;padding:8px 12px}
  .nav-item.on::before{display:none}
  main{padding:16px 14px 60px}
}
</style>
</head>
<body>

<div id="gate">
  <form class="gate-card" onsubmit="return login(event)">
    <h1 class="gate-logo">推しコール</h1>
    <p class="gate-sub">管理コンソール ／ Dream Noark</p>
    <div class="field">
      <label>管理トークン</label>
      <input id="tok" type="password" autocomplete="current-password" placeholder="••••••••••••••••" autofocus>
    </div>
    <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:12px 0 16px;cursor:pointer">
      <input type="checkbox" id="remember" checked style="width:auto"> このブラウザに記憶する
    </label>
    <button class="btn" style="width:100%" type="submit">ログイン</button>
    <p id="gate-err" style="color:var(--red);font-size:12px;margin:12px 0 0;min-height:16px"></p>
  </form>
</div>

<div id="app">
  <aside>
    <div class="brand"><span class="dot"></span>推しコール</div>
    <div id="nav"></div>
  </aside>
  <main>
    <div class="topbar">
      <div>
        <h1 id="title">ダッシュボード</h1>
        <div class="crumb" id="crumb"></div>
      </div>
      <div class="spacer"></div>
      <div id="tools" class="row"></div>
      <span class="chip" id="clock"></span>
      <button class="btn ghost sm" onclick="refresh()">⟳ 更新</button>
      <button class="btn ghost sm" onclick="logout()">ログアウト</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card" id="modal-body"></div></div>
<div id="toast"></div>

<script>
const API = "https://imcmtdyjbjbxuvecwslf.supabase.co/functions/v1/admin-api";
let TOKEN = "";
let STATE = {};      // 画面ごとのキャッシュ
let VIEW = "dash";
let PARAM = null;
let timer = null;

/* ============ 基本ユーティリティ ============ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const n = (v) => Number(v ?? 0).toLocaleString("ja-JP");
const yen = (v) => "¥" + Number(v ?? 0).toLocaleString("ja-JP");

function dt(s, short) {
  if (!s) return "—";
  const d = new Date(s);
  const p = (x) => String(x).padStart(2, "0");
  const base = `${d.getMonth()+1}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  return short ? base : `${d.getFullYear()}/${base}`;
}
function ago(s) {
  if (!s) return "—";
  const m = (Date.now() - new Date(s).getTime()) / 60000;
  if (m < 1) return "たった今";
  if (m < 60) return `${Math.floor(m)}分前`;
  if (m < 1440) return `${Math.floor(m/60)}時間前`;
  if (m < 43200) return `${Math.floor(m/1440)}日前`;
  return `${Math.floor(m/43200)}ヶ月前`;
}
function toast(msg, err) {
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : "");
  el.textContent = msg;
  $("#toast").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateX(26px)"; el.style.transition = ".3s"; }, 3200);
  setTimeout(() => el.remove(), 3600);
}

async function api(action, params = {}) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-admin-token": TOKEN },
    body: JSON.stringify({ action, ...params }),
  });
  const j = await r.json().catch(() => ({ error: "レスポンスの解析に失敗しました" }));
  if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
  return j.data;
}

/* ============ ログイン ============ */
async function login(e) {
  e.preventDefault();
  const t = $("#tok").value.trim();
  if (!t) return false;
  $("#gate-err").textContent = "確認中…";
  try {
    TOKEN = t;
    await api("ping");
    if ($("#remember").checked) localStorage.setItem("oc_admin_token", t);
    $("#gate").style.display = "none";
    $("#app").classList.add("on");
    buildNav();
    go(location.hash.slice(1) || "dash");
    startClock();
  } catch (err) {
    TOKEN = "";
    $("#gate-err").textContent = String(err.message).includes("unauthorized") ? "トークンが違います" : String(err.message);
  }
  return false;
}
function logout() {
  localStorage.removeItem("oc_admin_token");
  location.reload();
}
function startClock() {
  const tick = () => {
    const d = new Date();
    const p = (x) => String(x).padStart(2, "0");
    $("#clock").textContent = `${d.getFullYear()}/${d.getMonth()+1}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  };
  tick(); setInterval(tick, 1000);
}

/* ============ ナビゲーション ============ */
const NAV = [
  { g: "モニタリング", items: [
    { id: "dash", ic: "📊", label: "ダッシュボード" },
    { id: "live", ic: "📡", label: "ライブフィード" },
  ]},
  { g: "コミュニティ", items: [
    { id: "rooms", ic: "🏠", label: "ルーム" },
    { id: "users", ic: "👥", label: "ユーザー" },
    { id: "content", ic: "📅", label: "コンテンツ" },
  ]},
  { g: "安全", items: [
    { id: "mod", ic: "🛡", label: "モデレーション", badgeKey: "reports" },
    { id: "ng", ic: "🚫", label: "NGワード" },
  ]},
  { g: "ビジネス", items: [
    { id: "revenue", ic: "💎", label: "収益" },
    { id: "push", ic: "🔔", label: "プッシュ通知" },
  ]},
  { g: "システム", items: [
    { id: "system", ic: "⚙️", label: "システム" },
    { id: "sql", ic: "🧪", label: "SQLコンソール" },
    { id: "audit", ic: "📜", label: "操作ログ" },
  ]},
];
function buildNav() {
  $("#nav").innerHTML = NAV.map((g) => `
    <div class="nav-group">${g.g}</div>
    ${g.items.map((i) => `<div class="nav-item" data-id="${i.id}" onclick="go('${i.id}')">
      <span class="ic">${i.ic}</span>${i.label}
      <span class="badge" id="badge-${i.id}" style="display:none"></span>
    </div>`).join("")}
  `).join("");
}
function markNav() {
  document.querySelectorAll(".nav-item").forEach((e) => e.classList.toggle("on", e.dataset.id === VIEW));
}
function go(hash) {
  const [v, p] = String(hash).split(":");
  VIEW = v || "dash"; PARAM = p ? decodeURIComponent(p) : null;
  location.hash = hash;
  markNav();
  if (timer) { clearInterval(timer); timer = null; }
  render();
}
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1) || "dash";
  const [v, p] = h.split(":");
  if (v !== VIEW || (p ? decodeURIComponent(p) : null) !== PARAM) go(h);
});
function refresh() { render(true); }

/* ============ グラフ（依存なしSVG） ============ */
function lineChart(rows, key, color, h = 150) {
  const vals = rows.map((r) => Number(r[key] ?? 0));
  const max = Math.max(1, ...vals);
  const W = 1000, H = h, pad = 8;
  const step = vals.length > 1 ? (W - pad * 2) / (vals.length - 1) : 0;
  const pt = (v, i) => [pad + i * step, H - pad - (v / max) * (H - pad * 2.4)];
  const pts = vals.map(pt);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${W-pad} ${H} L${pad} ${H} Z`;
  const id = "g" + Math.random().toString(36).slice(2, 8);
  const dots = pts.map((p, i) => vals[i] > 0
    ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${color}"><title>${esc(rows[i].label)}: ${n(vals[i])}</title></circle>` : "").join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${h}px;overflow:visible">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".38"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})" style="animation:fadeUp .7s ease both"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
      style="--len:4000;stroke-dasharray:4000;animation:draw 1.4s cubic-bezier(.3,1,.4,1) both"/>
    ${dots}
  </svg>
  <div style="display:flex;justify-content:space-between;color:var(--dim);font-size:10.5px;margin-top:6px">
    <span>${esc(rows[0]?.label ?? "")}</span><span>最大 ${n(max)}</span><span>${esc(rows.at(-1)?.label ?? "")}</span>
  </div>`;
}
function barRow(label, value, max, color, right) {
  const w = max > 0 ? Math.max(2, (value / max) * 100) : 0;
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
    <div style="width:130px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${label}</div>
    <div class="bar" style="flex:1"><i style="width:${w}%;background:${color || "linear-gradient(90deg,var(--pink),var(--purple))"}"></i></div>
    <div class="num" style="width:82px;font-size:12px;color:var(--muted)">${right ?? n(value)}</div>
  </div>`;
}

/* ============ テーブルヘルパー ============ */
function table(cols, rows, opts = {}) {
  if (!rows || !rows.length) return `<div class="empty">${opts.empty || "データがありません"}</div>`;
  return `<div class="tw"><table>
    <thead><tr>${cols.map((c) => `<th class="${c.num ? "num" : ""}">${c.h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="${opts.onClick ? "click" : ""}" ${opts.onClick ? `onclick="${opts.onClick(r)}"` : ""}
      style="animation:fadeUp .4s cubic-bezier(.2,1,.3,1) both;animation-delay:${Math.min(i * 14, 300)}ms">
      ${cols.map((c) => `<td class="${c.num ? "num" : ""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div>`;
}
function loading() {
  return `<div class="grid" style="gap:12px">${Array.from({length:5},(_,i)=>`<div class="sk" style="height:${i?54:96}px;animation-delay:${i*80}ms"></div>`).join("")}</div>`;
}
function avatar(url, emoji, size) {
  const s = size || 26;
  return url
    ? `<img class="avatar" src="${esc(url)}" style="width:${s}px;height:${s}px" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'avatar',textContent:'${esc(emoji||"🌟")}'}))">`
    : `<span class="avatar" style="width:${s}px;height:${s}px;font-size:${s*0.55}px">${esc(emoji || "🌟")}</span>`;
}
function colorDot(c) { return `<span class="swatch" style="background:#${esc(c || "FF5C8A")}"></span>`; }
function kindTag(k, amount) {
  const m = { text:["n","発言"], penlight:["p","ペンラ"], stamp:["y","スタンプ"], super_chat:["g","スパチャ"], announce:["y","告知"] };
  const [cls, label] = m[k] || ["n", k];
  return `<span class="tag ${cls}">${label}${k === "super_chat" && amount ? " " + yen(amount) : ""}</span>`;
}
const CAT = { tv:["📺","TV出演"], live:["🎤","ライブ"], goods:["🛍","グッズ"], streaming:["💻","配信"], lottery:["🎫","当落"], other:["✨","その他"] };

/* ============ モーダル ============ */
function modal(html) { $("#modal-body").innerHTML = html; $("#modal").classList.add("on"); }
function closeModal() { $("#modal").classList.remove("on"); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

async function act(action, params, msg) {
  try {
    await api(action, params);
    toast(msg || "実行しました");
    closeModal();
    render(true);
  } catch (e) { toast("失敗: " + e.message, true); }
}
function confirmAct(text, action, params, msg) {
  modal(`<h3>確認</h3><p style="color:var(--muted);font-size:13.5px;line-height:1.8">${text}</p>
    <div class="row" style="justify-content:flex-end;margin-top:20px">
      <button class="btn ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn danger" onclick='act(${JSON.stringify(action)}, ${JSON.stringify(params)}, ${JSON.stringify(msg || "実行しました")})'>実行する</button>
    </div>`);
}

    mod:["モデレーション","通報・非表示・ミュート"], ng:["NGワード","審査不要で即反映"],
    revenue:["収益","スパチャの内訳と推移"], push:["プッシュ通知","端末と到達数"],
    system:["システム","テーブルと設定"], sql:["SQLコンソール","読み取り専用"], audit:["操作ログ","管理画面からの操作履歴"],
  }[VIEW] || ["", ""];
  $("#title").textContent = meta[0]; $("#crumb").textContent = meta[1]; $("#tools").innerHTML = "";

    v.innerHTML = `<div class="card"><div class="empty">読み込みに失敗しました<br><span class="mono">${esc(e.message)}</span></div></div>`;
  }
}

function saveRoom(id) {
  const fields = {};
  ["name","color","genre","birthday","debut_date","agency","official_tag","profile_bio"].forEach((k) => {
    const el = $("#f-" + k); if (el) fields[k] = el.value.trim();

}

  $("#newtok").type = "text"; $("#newtok").value = t;
  toast("生成しました。忘れずに控えてください");
}

    toast("変更しました");

const SAMPLES = [
  ["曜日ごとの発言数", "select to_char(created_at, 'Dy') as day, count(*)::int as n from messages group by 1 order by n desc"],
  ["時間帯ごとの発言数", "select extract(hour from created_at)::int as hour, count(*)::int as n from messages group by 1 order by 1"],
  ["ルームごとの平均発言長", "select r.name, round(avg(length(m.content)))::int as avg_len, count(*)::int as n from messages m join rooms r on r.id=m.room_id where m.kind='text' group by r.name order by n desc"],
  ["予定カテゴリの人気", "select category, count(*)::int as n, sum(attendee_count)::int as attendees from events group by 1 order by n desc"],
  ["1度も発言していないメンバー", "select p.user_name, p.user_id from profiles p where not exists (select 1 from messages m where m.user_id = p.user_id)"],
  ["最近7日に動きがないルーム", "select r.name, max(m.created_at) as last from rooms r left join messages m on m.room_id=r.id group by r.name having coalesce(max(m.created_at), '2000-01-01') < now() - interval '7 days'"],
];
async function viewSql() {
  $("#view").innerHTML = `
    <div class="card anim" style="margin-bottom:14px">
      <h2>🧪 SQLコンソール <span class="cnt">読み取り専用</span></h2>
      <p style="color:var(--muted);font-size:12.5px">SELECT / WITH で始まるクエリだけ実行できます。書き込み（INSERT・UPDATE・DELETE等）はサーバー側で拒否されます。</p>
      <textarea id="sqlq" rows="5" class="mono" style="font-size:13px" placeholder="select count(*) from messages">${esc(STATE.sql || "select r.name, count(*)::int as messages\nfrom messages m join rooms r on r.id = m.room_id\ngroup by r.name order by messages desc")}</textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" onclick="runSql()">▶ 実行（⌘/Ctrl + Enter）</button>
        <span class="spacer"></span>
        ${SAMPLES.map(([l,q],i)=>`<span class="chip click" onclick="$('#sqlq').value=${JSON.stringify(q)};runSql()">${l}</span>`).join("")}
      </div>
    </div>
    <div class="card anim" id="sqlout"><div class="empty">クエリを実行すると結果がここに出ます</div></div>`;
  $("#sqlq").addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") runSql(); });
}
async function runSql() {
  const q = $("#sqlq").value.trim();
  STATE.sql = q;
  const out = $("#sqlout");
  out.innerHTML = loading();
  try {
    const t0 = performance.now();
    const rows = await api("query", { q });
    const ms = Math.round(performance.now() - t0);
    if (!rows.length) { out.innerHTML = `<div class="empty">0件（${ms}ms）</div>`; return; }
    const cols = Object.keys(rows[0]);
    out.innerHTML = `<h2>結果 <span class="cnt">${rows.length}件 · ${ms}ms</span>
      <span class="spacer"></span><button class="btn ghost xs" onclick="copyCsv()">CSVでコピー</button></h2>
      ${table(cols.map((c)=>({ h:c, f:(r)=>{
        const v = r[c];
        return typeof v === "object" && v !== null ? `<span class="mono">${esc(JSON.stringify(v))}</span>` : esc(v ?? "—");
      }})), rows)}`;
    STATE.sqlRows = rows;
  } catch (e) {
    out.innerHTML = `<div class="empty" style="color:var(--red)">${esc(e.message)}</div>`;
  }
}
function copyCsv() {
  const rows = STATE.sqlRows || [];
  if (!rows.length) return;
  const cols = Object.keys(rows[0]);
  const csv = [cols.join(","), ...rows.map((r) => cols.map((c) => {
    const v = r[c];
    const s = typeof v === "object" && v !== null ? JSON.stringify(v) : String(v ?? "");
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(","))].join("\n");
  navigator.clipboard.writeText(csv).then(() => toast("CSVをコピーしました"));
}

/* ============ ⑫ 操作ログ ============ */
async function viewAudit() {
  const rows = await api("auditLog");
  $("#view").innerHTML = `<div class="card anim">
    <h2>この管理画面から行った操作 <span class="cnt">最新200件</span></h2>
    <p style="color:var(--muted);font-size:12.5px;margin:-6px 0 14px">読み取りは記録されません。書き込み・削除・設定変更だけが残ります。</p>
    ${table([
      { h:"日時", f:(a)=>dt(a.created_at) },
      { h:"操作", f:(a)=>`<span class="tag ${String(a.action).match(/delete|mute|hide/i)?"r":"p"}">${esc(a.action)}</span>` },
      { h:"内容", f:(a)=>`<div class="trunc mono" style="max-width:620px">${esc(JSON.stringify(a.params))}</div>` },
    ], rows, { empty:"まだ操作はありません" })}</div>`;
}

  const saved = localStorage.getItem("oc_admin_token");
  if (saved) { $("#tok").value = saved; $("#remember").checked = true; $("#gate").querySelector("form").requestSubmit(); }
})();
</script>
